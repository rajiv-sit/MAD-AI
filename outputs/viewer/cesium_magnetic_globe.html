      });
    }

    const pointEntities = sampleData.map((point, index) => buildPoint(point, index));

    function refreshPoints() {
      pointEntities.forEach((entity, index) => {
        const point = sampleData[index];
        entity.point.color = colorForPoint(point);
        entity.description = descriptionForPoint(point);
      });
    }

    const componentSelect = document.getElementById("componentSelect");
    componentOptions.forEach((label) => {
      const option = document.createElement("option");
      option.value = label;
      option.textContent = label;
      option.selected = label === currentComponent;
      componentSelect.appendChild(option);
    });
    componentSelect.addEventListener("change", (event) => {
      currentComponent = event.target.value;
      refreshPoints();
    });

    if (sampleData.length > 0) {
      viewer.flyTo(viewer.entities, {
        duration: 1.8
      });
    }
  </script>
</body>
</html>
