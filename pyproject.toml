[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mad-ai"
version = "0.1.0"
description = "Magnetic anomaly detection pipeline with WMM baseline, ML models, and visualization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
]
viz = [
    "PySide6>=6.7",
]
wmm = [
    "geomag>=0.9",
    "wmm2020>=1.1",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
